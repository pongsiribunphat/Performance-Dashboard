<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้ารวม - เลือกระบบเครื่อง</title>
    
    <!-- ดึงฟอนต์ 'Prompt' จาก Google Fonts มาใช้ให้เข้าชุดกัน -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            text-align: center; 
            padding-top: 50px; 
            background-color: #f0f8ff; /* สีพื้นหลังฟ้าอ่อน เข้าชุดกับหน้าย่อย */
            color: #333; 
        }

        h1 {
            color: #0056b3; /* สีหัวข้อหลัก */
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 40px;
            color: #555;
        }

        .menu { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; /* ระยะห่างระหว่างปุ่ม */
        }

        /* ตกแต่งปุ่มเมนูแต่ละเครื่อง */
        a {
            font-family: 'Prompt', sans-serif;
            text-decoration: none;
            font-size: 22px;
            font-weight: 600;
            color: white;
            background-color: #007bff; /* สีปุ่มหลัก (น้ำเงิน) */
            padding: 18px 40px;
            border-radius: 12px;
            width: 250px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15); /* เพิ่มเงาให้ปุ่มดูมีมิติ */
            transition: 0.2s; /* เอฟเฟกต์ความนุ่มนวล */
        }

        /* เอฟเฟกต์เวลาเอาเมาส์ไปชี้ที่ปุ่ม */
        a:hover { 
            background-color: #0056b3; /* สีเข้มขึ้น */
            transform: scale(1.05); /* ปุ่มขยายขนาดขึ้นเล็กน้อย */
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>ระบบบันทึกข้อมูลเครื่องจักร</h1>
    <p>กรุณาเลือกเครื่องที่คุณเข้าใช้งาน</p>
    
    <div class="menu">
        <!-- ลิงก์ยังคงชี้ไปที่ไฟล์ html เดิม แต่เปลี่ยนชื่อที่แสดงผลเป็น "เครื่องที่" -->
        <a href="person1.html">🖥️ เข้าสู่หน้า: เครื่องที่ 1</a>
        <a href="person2.html">🖥️ เข้าสู่หน้า: เครื่องที่ 2</a>
        <a href="person3.html">🖥️ เข้าสู่หน้า: เครื่องที่ 3</a>
        <a href="person4.html">🖥️ เข้าสู่หน้า: เครื่องที่ 4</a>
        <a href="dashboard.html" style="background-color: #28a745;">📊 ดู Dashboard สรุปผล</a>
    </div>

</body>
</html>
